[project]
name = "dsw-mailer"
description = "Worker for sending email notifications"
readme = "README.md"
keywords = ["email", "jinja2", "notification", "template"]
license = { text = "Apache License 2.0" }
authors = [
    { name = "Marek Suchánek", email = "marek.suchanek@ds-wizard.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Text Processing",
]
requires-python = ">=3.14, <4"
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://ds-wizard.org"
Repository = "https://github.com/ds-wizard/engine-tools"
Documentation = "https://guide.ds-wizard.org"
Issues = "https://github.com/ds-wizard/ds-wizard/issues"

[project.scripts]
dsw-mailer = "dsw.mailer:main"

[build-system]
requires = ["hatchling==1.32.0", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["dsw"]
artifacts = ["dsw/*/build_info.py"]

[tool.hatch.build.targets.sdist]
artifacts = ["dsw/*/build_info.py"]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["boto3", "click", "dkimpy", "Jinja2", "Markdown", "pathvalidate", "polib", "python-dateutil", "sentry-sdk", "tenacity", "dsw-command-queue=={{ version }}", "dsw-config=={{ version }}", "dsw-database=={{ version }}", "dsw-storage=={{ version }}"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
