[project]
name = "dsw-document-worker"
description = "Worker for assembling and transforming documents"
readme = "README.md"
keywords = ["documents", "generation", "jinja2", "pandoc", "worker"]
license = { text = "Apache License 2.0" }
authors = [
    { name = "Marek Suchánek", email = "marek.suchanek@ds-wizard.org" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]
requires-python = ">=3.14, <4"
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.urls]
Homepage = "https://ds-wizard.org"
Repository = "https://github.com/ds-wizard/engine-tools"
Documentation = "https://guide.ds-wizard.org"
Issues = "https://github.com/ds-wizard/ds-wizard/issues"

[project.scripts]
dsw-document-worker = "dsw.document_worker:main"

[build-system]
requires = ["hatchling==1.32.0", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["dsw"]
artifacts = ["dsw/*/build_info.py"]

[tool.hatch.build.targets.sdist]
artifacts = ["dsw/*/build_info.py"]

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["Babel", "click", "Jinja2", "panflute", "pathvalidate", "pluggy", "polib", "python-dateutil", "python-slugify", "rdflib", "rdflib-jsonld", "requests", "sentry-sdk", "tenacity", "weasyprint", "XlsxWriter", "dsw-command-queue=={{ version }}", "dsw-config=={{ version }}", "dsw-database=={{ version }}", "dsw-models[rendering]=={{ version }}", "dsw-storage=={{ version }}"]
optional-dependencies = { test = ["pytest"] }

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
