  response:
    body:
      string: "{\"content\":\"{#- Reads the raw 19.0 document context only (ctx),
        not ctx|to_context_obj, so it does not\\n    depend on the object model of
        the worker under test. -#}\\n{%- set project = ctx.project -%}\\n{%- set editor
        = ctx.knowledgeModelEditor -%}\\n{%- set doc = ctx.document -%}\\n<!DOCTYPE
        html>\\n<html lang=\\\"{{ doc.language or 'en' }}\\\">\\n<head><meta charset=\\\"utf-8\\\"><title>{{
        doc.name }}</title>\\n<style>body{font-family:sans-serif;margin:2rem}td,th{border:1px
        solid #ccc;padding:.3rem .6rem;text-align:left}table{border-collapse:collapse}</style>\\n</head>\\n<body>\\n<h1>{{
        doc.name }}</h1>\\n<p>{{ _('Smoke test of the document worker') }}</p>\\n<p>{%
        trans count=ctx.questionnaire.replies|length %}One reply{% pluralize %}{{
        count }} replies{% endtrans %}</p>\\n<table>\\n  <tr><th>Metamodel version</th><td>{{
        ctx.metamodelVersion }}</td></tr>\\n  <tr><th>Context hash</th><td><code>{{
        ctx.hash }}</code></td></tr>\\n  <tr><th>Workspace</th><td>{{ ctx.workspace.name
        }} ({{ ctx.workspace.uuid }})</td></tr>\\n  <tr><th>Source</th><td>{% if project
        %}project \u201C{{ project.name }}\u201D{% elif editor %}KM editor \u201C{{
        editor.name }}\u201D{% else %}none{% endif %}</td></tr>\\n  <tr><th>Knowledge
        model package</th><td>{% if ctx.knowledgeModelPackage %}{{ ctx.knowledgeModelPackage.id
        }}:{{ ctx.knowledgeModelPackage.version }}{% else %}\u2013{% endif %}</td></tr>\\n
        \ <tr><th>Template</th><td>{{ doc.documentTemplate.id }}:{{ doc.documentTemplate.version
        }}, format {{ doc.format.name }}</td></tr>\\n  <tr><th>Preview</th><td>{{
        doc.preview }}</td></tr>\\n  <tr><th>Replies</th><td>{{ ctx.questionnaire.replies
        | length }}</td></tr>\\n  <tr><th>Chapters</th><td>{{ ctx.knowledgeModel.chapterUuids
        | length }}</td></tr>\\n  <tr><th>App</th><td>{{ ctx.config.appTitle }} \u2013
        {{ ctx.config.clientUrl }}</td></tr>\\n</table>\\n<h2>Replies</h2>\\n<ul>\\n{%-
        for path, reply in ctx.questionnaire.replies.items() %}\\n  <li><code>{{ path
        }}</code>: {{ reply.value.type }} {{ reply.value.value }}</li>\\n{%- endfor
        %}\\n</ul>\\n</body>\\n</html>\\n\",\"createdAt\":\"2026-10-14T17:24:50.464552Z\",\"documentTemplateUuid\":\"882760cc-f9b2-4ab3-a49e-22ac7497ba05\",\"fileName\":\"src/smoke.html.j2\",\"tenantUuid\":\"bf9fa415-f2e1-43d2-82be-4b8241d14d7f\",\"updatedAt\":\"2026-10-14T17:24:50.464552Z\",\"uuid\":\"21dcdc80-3d82-4072-8f52-ab6c30011f1e\"}"
