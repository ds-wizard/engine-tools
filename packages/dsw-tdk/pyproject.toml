[project]
name = "dsw-tdk"
description = "Data Stewardship Wizard Template Development Toolkit"
readme = "README.md"
keywords = ["documents", "dsw", "jinja2", "template", "toolkit"]
license = { text = "Apache License 2.0" }
authors = [
    { name = "Marek Suchánek", email = "marek.suchanek@ds-wizard.org" }
]
classifiers = [
    "Framework :: AsyncIO",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
requires-python = ">=3.12, <4"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-recording",
    "vcrpy",
]

[project.urls]
Homepage = "https://ds-wizard.org"
Repository = "https://github.com/ds-wizard/engine-tools"
Documentation = "https://guide.ds-wizard.org"
Issues = "https://github.com/ds-wizard/ds-wizard/issues"

[project.scripts]
dsw-tdk = "dsw.tdk:main"

[build-system]
requires = ["hatchling==1.32.0", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.metadata.hooks.uv-dynamic-versioning]
dependencies = ["aiohttp", "Babel", "click", "colorama", "humanize", "Jinja2", "multidict", "pathspec", "pydantic", "python-dotenv", "python-slugify", "watchfiles", "dsw-models=={{ version }}"]

[tool.hatch.build.targets.wheel]
packages = ["dsw"]
artifacts = ["dsw/*/build_info.py"]

[tool.hatch.build.targets.sdist]
artifacts = ["dsw/*/build_info.py"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
