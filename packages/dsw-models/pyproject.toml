[project]
name = "dsw-models"
description = "Data Stewardship Wizard models, transformations and tooling"
readme = "README.md"
keywords = ["dsw", "models", "knowledge-model", "pydantic", "json-schema"]
license = { text = "Apache License 2.0" }
authors = [
    { name = "Marek Suchánek", email = "marek.suchanek@ds-wizard.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
requires-python = ">=3.12, <4"
dependencies = [
    "pydantic>=2.12",
    "python-dateutil",
]
dynamic = ["version"]

[project.optional-dependencies]
rendering = [
    "Markdown",
    "MarkupSafe",
    "nh3",
    "pymdown-extensions",
]
test = [
    "hypothesis",
    "jsonschema",
    "pytest",
]

[project.urls]
Homepage = "https://ds-wizard.org"
Repository = "https://github.com/ds-wizard/engine-tools"
Documentation = "https://guide.ds-wizard.org"
Issues = "https://github.com/ds-wizard/ds-wizard/issues"

[build-system]
requires = ["hatchling==1.32.0", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"


[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["dsw"]
artifacts = ["dsw/*/build_info.py"]

[tool.hatch.build.targets.sdist]
artifacts = ["dsw/*/build_info.py"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
