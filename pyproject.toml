[dependency-groups]
dev = [
    "ruff==0.16.5",
    "tomlkit>=0.15.0",
    "ty==0.0.77",
]
test = [
    "pytest",
    "pytest-recording",
    "vcrpy",
]
translations = [
    "babel==2.18.0",
]

[tool.uv.sources]
dsw-command-queue = { workspace = true }
dsw-config = { workspace = true }
dsw-data-seeder = { workspace = true }
dsw-database = { workspace = true }
dsw-document-worker = { workspace = true }
dsw-mailer = { workspace = true }
dsw-models = { workspace = true }
dsw-storage = { workspace = true }
dsw-tdk = { workspace = true }
dsw-templating = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ty.src]
include = ["packages/*/dsw"]

[tool.ruff]
target-version = "py314"
line-length = 100
indent-width = 4
include = ["packages/*/dsw/**/*.py"]
# Lets ruff resolve `dsw.models.*` through the PEP 420 namespace (see runtime-evaluated-base-classes).
namespace-packages = ["packages/dsw-models/dsw"]

[tool.ruff.lint]
select = [
    #"A",
    "E",
    "F",
    "COM",
    "B",
    #"PL",
    "UP",
    "S",
    "N",
    "PERF",
    "PGH",
    "FURB",
    "I",
    "ERA",
    "FAST",
    "YTT",
    #"ANN",
    #"ASYNC",
    #"BLE",
    #"FBT",
    "C4",
    #"CPY",
    "DTZ",
    "T10",
    #"EM",
    "EXE",
    "FIX",
    "FA",
    "INT",
    #"ISC",
    "ICN",
    "LOG",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    #"TID",
    "TD",
    "TC",
    #"ARG",
    "PTH",
    "FLY",
    "C90",
    #"RUF",
    #"TRY",
]
ignore = [
    "S404", "S603",  # subprocess used in controlled way only
]
preview = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.isort]
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "monorepo",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"monorepo" = ["dsw"]

[tool.ruff.lint.per-file-ignores]
# Uncertain metamodel migration steps are kept as explained TODOs by decision.
"packages/dsw-models/dsw/models/**/migrations/*.py" = ["FIX002", "TD002", "TD003"]
"packages/dsw-models/dsw/models/**/migrations.py" = ["FIX002", "TD002", "TD003"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves annotations at runtime, so their imports must stay real.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "dsw.models.common.BaseModel",
]

[tool.ruff.lint.flake8-bandit]
allowed-markup-calls = [
    "markdown.markdown",
    "dsw.models.document_context.rendering.sanitize_html",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["mcs"]
