name: Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches and PRs. Never on main or tags:
  # the release gate in release-package.yml requires a completed Pipeline run
  # for the release commit.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main'
        && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-worker:
    name: Test
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os:
        - 'macos-latest'
        - 'ubuntu-latest'
        - 'windows-latest'
        python-version:
        - '3.14'

    runs-on: ${{ matrix.os }}

    env:
      DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    - name: Install Ghostscript (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update -y && sudo apt-get install ghostscript -y

    - name: Install DejaVu, Pango and Ghostscript (MacOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install --cask font-dejavu
        brew install pango ghostscript

    - name: Install DejaVu, Pango and Ghostscript (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        C:\msys64\usr\bin\bash -lc 'pacman -S mingw-w64-x86_64-ttf-dejavu mingw-w64-x86_64-pango mingw-w64-x86_64-ghostscript --noconfirm'
        xcopy "C:\msys64\mingw64\share\fonts\TTF" "C:\Users\runneradmin\.fonts" /e /i
        echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH
        rm C:\msys64\mingw64\bin\python.exe

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Install dependencies
      run: |
        uv sync --locked --all-packages --all-extras --dev

    # Each package runs with continue-on-error so one failure does not hide the
    # others. The result is taken from the runner-recorded step outcome, not
    # from anything the step itself writes, so a step that fails to launch at
    # all is still counted as a failure by "Evaluate tests" below.
    - name: "Test: command-queue"
      id: test-command-queue
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-command-queue

    - name: "Test: config"
      id: test-config
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-config

    - name: "Test: data-seeder"
      id: test-data-seeder
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-data-seeder

    - name: "Test: database"
      id: test-database
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-database

    - name: "Test: document-worker"
      id: test-document-worker
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-document-worker

    - name: "Test: mailer"
      id: test-mailer
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-mailer

    - name: "Test: models"
      id: test-models
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-models

    - name: "Test: storage"
      id: test-storage
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-storage

    - name: "Test: TDK"
      id: test-tdk
      continue-on-error: true
      run: |
        uv run --no-sync bash scripts/test-package.sh dsw-tdk

    - name: "Evaluate tests"
      if: always()
      shell: bash
      env:
        # An empty value means the step never ran (e.g. setup failed earlier),
        # which must be treated as a failure rather than silently passing.
        OUTCOMES: |
          dsw-command-queue=${{ steps.test-command-queue.outcome }}
          dsw-config=${{ steps.test-config.outcome }}
          dsw-data-seeder=${{ steps.test-data-seeder.outcome }}
          dsw-database=${{ steps.test-database.outcome }}
          dsw-document-worker=${{ steps.test-document-worker.outcome }}
          dsw-mailer=${{ steps.test-mailer.outcome }}
          dsw-models=${{ steps.test-models.outcome }}
          dsw-storage=${{ steps.test-storage.outcome }}
          dsw-tdk=${{ steps.test-tdk.outcome }}
      run: |
        EXPECTED=9
        SEEN=0
        FAILED=""
        while IFS='=' read -r pkg outcome; do
          [ -n "$pkg" ] || continue
          SEEN=$((SEEN + 1))
          if [ "$outcome" = "success" ]; then
            echo "## $pkg: passed"
          else
            echo "## $pkg: FAILED (outcome: ${outcome:-did not run})"
            FAILED="$FAILED $pkg"
          fi
        done <<< "$OUTCOMES"

        if [ "$SEEN" -ne "$EXPECTED" ]; then
          echo "## Expected $EXPECTED packages, evaluated $SEEN"
          exit 1
        fi
        if [ -n "$FAILED" ]; then
          echo "## Failed packages:$FAILED"
          exit 1
        fi
        echo "## All $EXPECTED packages passed"

  # dsw-tdk declares requires-python >=3.12 (unlike the rest of the workspace,
  # which is >=3.14) because it is a CLI that end users pip install. It has no
  # workspace dependencies, so it is installed standalone here rather than via
  # `uv sync`, which is bound to the root >=3.14 floor. Python 3.14 is already
  # covered across all three OSes by the test-worker job above.
  test-tdk-oldest:
    name: Test TDK
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Create environment
      run: |
        uv venv --no-project --python ${{ matrix.python-version }}

    - name: Install dsw-tdk with test dependencies
      run: |
        uv pip install './packages/dsw-tdk[test]'
        .venv/bin/python --version

    - name: "Verify: TDK"
      run: |
        .venv/bin/dsw-tdk --version

    - name: "Test: TDK"
      working-directory: packages/dsw-tdk
      run: |
        ../../.venv/bin/pytest -s tests

  package:
    name: Python Package
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package:
        - dsw-command-queue
        - dsw-config
        - dsw-data-seeder
        - dsw-database
        - dsw-document-worker
        - dsw-mailer
        - dsw-models
        - dsw-storage
        - dsw-tdk
        python-version:
        - "3.14"

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Install package with dependencies
      run: |
        uv sync --locked --package ${{ matrix.package }}

    - name: Verify installation
      run: |
        uv run python scripts/import-package.py ${{ matrix.package }}

    - name: Build distribution packages
      run: |
        uv build --no-create-gitignore --package ${{ matrix.package }}
        ls -lah dist/

  docker:
    name: Docker
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Images must never be published from a red commit: test-worker gates the
    # push, package gates the build inputs.
    needs: [package, test-worker]
    timeout-minutes: 90  # multi-arch: linux/arm64 builds under QEMU emulation

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - dsw-data-seeder
          - dsw-document-worker
          - dsw-mailer
          - dsw-tdk

    env:
      IMAGE_PREFIX: 'ghcr.io/ds-wizard'
      PUBLIC_IMAGE_PREFIX: 'datastewardshipwizard'
      DOCKER_META_CONTEXT: '.'
      DOCKER_META_FILE: './packages/${{ matrix.package }}/Dockerfile'
      DOCKER_META_PLATFORMS: 'linux/amd64,linux/arm64'
      DOCKER_CACHE_SCOPE: '${{ matrix.package }}'

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Get Docker image name
      id: docker-image-name
      run: |
        cd packages/${{ matrix.package }}
        NAME=$(make docker-image-name)
        echo "NAME=$NAME" >> $GITHUB_OUTPUT

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    # TEST DOCKER IMAGE BUILD
    - name: Docker meta [test]
      id: meta-test
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=sha

    - name: Docker build [test]
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: false
        tags: ${{ steps.meta-test.outputs.tags }}
        labels: ${{ steps.meta-test.outputs.labels }}
        # mode=max is required: it caches the builder stage, where the
        # third-party wheel build lives. The dev/public builds below reuse
        # this within the job; later runs reuse it across the whole workflow.
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
        cache-to: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }},mode=max

    # PREPARE
    - name: Docker login [ghcr.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker login [docker.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    # DEVELOPMENT IMAGES
    - name: Docker meta [dev]
      id: meta-dev
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=ref,event=branch

    - name: Docker build+push [dev]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-dev.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-dev.outputs.tags }}
        labels: ${{ steps.meta-dev.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}

    # PUBLIC IMAGES
    - name: Docker meta [public]
      id: meta-public
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.PUBLIC_IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

    - name: Docker build+push [public]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-public.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-public.outputs.tags }}
        labels: ${{ steps.meta-public.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}

  lambda-docker:
    name: Docker (lambda)
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # Images must never be published from a red commit: test-worker gates the
    # push, package gates the build inputs.
    needs: [package, test-worker]
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - dsw-document-worker

    env:
      IMAGE_PREFIX: 'ghcr.io/${{ github.repository_owner }}'
      PUBLIC_IMAGE_PREFIX: 'datastewardshipwizard'
      DOCKER_META_CONTEXT: '.'
      DOCKER_META_FILE: './packages/${{ matrix.package }}/lambda.Dockerfile'
      DOCKER_META_PLATFORMS: 'linux/amd64'
      DOCKER_META_SUFFIX_LAMBDA: '-lambda'
      DOCKER_CACHE_SCOPE: '${{ matrix.package }}-lambda'

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Get Docker image name
      id: docker-image-name
      run: |
        cd packages/${{ matrix.package }}
        NAME=$(make docker-image-name)
        echo "NAME=$NAME" >> $GITHUB_OUTPUT

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    # TEST DOCKER IMAGE BUILD
    - name: Docker meta [test]
      id: meta-test
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=sha
        flavor: |
            suffix=${{ env.DOCKER_META_SUFFIX_LAMBDA }}

    - name: Docker build [test]
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: false
        tags: ${{ steps.meta-test.outputs.tags }}
        labels: ${{ steps.meta-test.outputs.labels }}
        # mode=max is required: it caches the builder stage, where the
        # third-party wheel build lives. The dev/public builds below reuse
        # this within the job; later runs reuse it across the whole workflow.
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
        cache-to: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }},mode=max

    # PREPARE
    - name: Docker login [ghcr.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker login [docker.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    # DEVELOPMENT IMAGES
    - name: Docker meta [dev]
      id: meta-dev
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=ref,event=branch
        flavor: |
            suffix=${{ env.DOCKER_META_SUFFIX_LAMBDA }}

    - name: Docker build+push [dev]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-dev.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-dev.outputs.tags }}
        labels: ${{ steps.meta-dev.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}

    # PUBLIC IMAGES
    - name: Docker meta [public]
      id: meta-public
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.PUBLIC_IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
        flavor: |
            suffix=${{ env.DOCKER_META_SUFFIX_LAMBDA }}

    - name: Docker build+push [public]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-public.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-public.outputs.tags }}
        labels: ${{ steps.meta-public.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
