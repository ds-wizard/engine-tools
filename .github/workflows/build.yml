name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches and PRs. Never on develop/main
  # or tags: the release gate in release-package.yml requires a completed
  # Test/Build run for the release commit.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/develop'
        && github.ref != 'refs/heads/main'
        && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  package:
    name: Python Package
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package:
        - dsw-command-queue
        - dsw-config
        - dsw-data-seeder
        - dsw-database
        - dsw-document-worker
        - dsw-mailer
        - dsw-models
        - dsw-storage
        - dsw-tdk
        python-version:
        - "3.14"

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Install package with dependencies
      run: |
        uv sync --locked --package ${{ matrix.package }}

    - name: Verify installation
      run: |
        uv run python scripts/import-package.py ${{ matrix.package }}

    - name: Build distribution packages
      run: |
        uv build --no-create-gitignore --package ${{ matrix.package }}
        ls -lah dist/

  docker:
    name: Docker
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 90  # multi-arch: linux/arm64 builds under QEMU emulation

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - dsw-data-seeder
          - dsw-document-worker
          - dsw-mailer
          - dsw-tdk

    env:
      IMAGE_PREFIX: 'ghcr.io/ds-wizard'
      PUBLIC_IMAGE_PREFIX: 'datastewardshipwizard'
      DOCKER_META_CONTEXT: '.'
      DOCKER_META_FILE: './packages/${{ matrix.package }}/Dockerfile'
      DOCKER_META_PLATFORMS: 'linux/amd64,linux/arm64'
      DOCKER_CACHE_SCOPE: '${{ matrix.package }}'

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Get Docker image name
      id: docker-image-name
      run: |
        cd packages/${{ matrix.package }}
        NAME=$(make docker-image-name)
        echo "NAME=$NAME" >> $GITHUB_OUTPUT

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    # TEST DOCKER IMAGE BUILD
    - name: Docker meta [test]
      id: meta-test
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=sha

    - name: Docker build [test]
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: false
        tags: ${{ steps.meta-test.outputs.tags }}
        labels: ${{ steps.meta-test.outputs.labels }}
        # mode=max is required: it caches the builder stage, where the
        # third-party wheel build lives. The dev/public builds below reuse
        # this within the job; later runs reuse it across the whole workflow.
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
        cache-to: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }},mode=max

    # PREPARE
    - name: Docker login [ghcr.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker login [docker.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    # DEVELOPMENT IMAGES
    - name: Docker meta [dev]
      id: meta-dev
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=ref,event=branch

    - name: Docker build+push [dev]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-dev.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-dev.outputs.tags }}
        labels: ${{ steps.meta-dev.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}

    # PUBLIC IMAGES
    - name: Docker meta [public]
      id: meta-public
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.PUBLIC_IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

    - name: Docker build+push [public]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-public.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-public.outputs.tags }}
        labels: ${{ steps.meta-public.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}

  lambda-docker:
    name: Docker (lambda)
    # Avoid double runs: in-repo branches are covered by the push event.
    # Fork PRs produce no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    needs: [package]
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - dsw-document-worker

    env:
      IMAGE_PREFIX: 'ghcr.io/${{ github.repository_owner }}'
      PUBLIC_IMAGE_PREFIX: 'datastewardshipwizard'
      DOCKER_META_CONTEXT: '.'
      DOCKER_META_FILE: './packages/${{ matrix.package }}/lambda.Dockerfile'
      DOCKER_META_PLATFORMS: 'linux/amd64'
      DOCKER_META_SUFFIX_LAMBDA: '-lambda'
      DOCKER_CACHE_SCOPE: '${{ matrix.package }}-lambda'

    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
          fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    - name: Get Docker image name
      id: docker-image-name
      run: |
        cd packages/${{ matrix.package }}
        NAME=$(make docker-image-name)
        echo "NAME=$NAME" >> $GITHUB_OUTPUT

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    # TEST DOCKER IMAGE BUILD
    - name: Docker meta [test]
      id: meta-test
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=sha
        flavor: |
            suffix=${{ env.DOCKER_META_SUFFIX_LAMBDA }}

    - name: Docker build [test]
      uses: docker/build-push-action@v7
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: false
        tags: ${{ steps.meta-test.outputs.tags }}
        labels: ${{ steps.meta-test.outputs.labels }}
        # mode=max is required: it caches the builder stage, where the
        # third-party wheel build lives. The dev/public builds below reuse
        # this within the job; later runs reuse it across the whole workflow.
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
        cache-to: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }},mode=max

    # PREPARE
    - name: Docker login [ghcr.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Docker login [docker.io]
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    # DEVELOPMENT IMAGES
    - name: Docker meta [dev]
      id: meta-dev
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=ref,event=branch
        flavor: |
            suffix=${{ env.DOCKER_META_SUFFIX_LAMBDA }}

    - name: Docker build+push [dev]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-dev.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-dev.outputs.tags }}
        labels: ${{ steps.meta-dev.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}

    # PUBLIC IMAGES
    - name: Docker meta [public]
      id: meta-public
      if: github.event_name != 'pull_request'
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.PUBLIC_IMAGE_PREFIX }}/${{ steps.docker-image-name.outputs.NAME }}
        tags: |
          type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
        flavor: |
            suffix=${{ env.DOCKER_META_SUFFIX_LAMBDA }}

    - name: Docker build+push [public]
      uses: docker/build-push-action@v7
      if: github.event_name != 'pull_request' && steps.meta-public.outputs.tags != ''
      with:
        context: ${{ env.DOCKER_META_CONTEXT }}
        file: ${{ env.DOCKER_META_FILE }}
        platforms: ${{ env.DOCKER_META_PLATFORMS }}
        push: true
        tags: ${{ steps.meta-public.outputs.tags }}
        labels: ${{ steps.meta-public.outputs.labels }}
        cache-from: type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
