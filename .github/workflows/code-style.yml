name: Code Style

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches and PRs. Never on develop/main
  # or tags: the release gate needs a completed Test/Build run per commit.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/develop'
        && github.ref != 'refs/heads/main'
        && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # CSpell
  cspell:
    name: CSpell
    # Avoid double runs: in-repo branches are covered by the push event above.
    # Fork PRs have no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Install CSpell
      run: |
        npm install -g cspell @cspell/dict-python

    - name: Run CSpell
      run: |
        cspell \
          --no-progress \
          --no-summary \
          --config .cspell/cspell.json \
          packages/**/*.py \
          packages/**/*.md \
          packages/**/*.json \
          packages/**/*.toml \
          packages/**/*.yml \
          packages/**/*.yaml

  # Ruff
  ruff:
    name: Ruff
    # Avoid double runs: in-repo branches are covered by the push event above.
    # Fork PRs have no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Install the project
      run: uv sync --locked --all-extras --all-packages --no-install-project --dev

    - name: Run Ruff
      run: |
        uv run ruff check

  # Ty
  ty:
    name: Ty
    # Avoid double runs: in-repo branches are covered by the push event above.
    # Fork PRs have no push event, so they are covered here instead.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Install the project
      run: uv sync --locked --all-extras --all-packages --no-install-project --dev

    - name: Run Ruff
      run: |
        uv run ty check
