name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Never cancel a release: publishing to PyPI is irreversible and a half-run
  # matrix would leave some packages published and others not.
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Gate: publishing to PyPI is irreversible, so refuse to start unless the tag
  # agrees with the package versions and CI was green for this exact commit.
  check:
    name: "Release Checks"
    runs-on: ubuntu-latest
    timeout-minutes: 40  # includes up to TIMEOUT_MINUTES waiting on CI

    permissions:
      contents: read
      actions: read  # read Pipeline run conclusions

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Verify tag matches package versions
      run: |
        uv run --no-project --with packaging \
          python scripts/check-release.py "${{ github.event.release.tag_name }}"

    - name: Pipeline
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SHA: ${{ github.sha }}
        # Releases are usually cut from an already-tested tag, so this normally
        # returns within seconds. The wait only matters when the release is
        # created while CI for the tag is still running.
        TIMEOUT_MINUTES: '30'
      run: |
        set -euo pipefail
        deadline=$(( $(date +%s) + TIMEOUT_MINUTES * 60 ))

        for wf in pipeline.yml; do
          echo "::group::$wf"
          while true; do
            run=$(gh run list --workflow "$wf" --commit "$SHA" --limit 1 \
                    --json status,conclusion,url)
            status=$(echo "$run" | jq -r '.[0].status // "not-found"')
            conclusion=$(echo "$run" | jq -r '.[0].conclusion // ""')
            url=$(echo "$run" | jq -r '.[0].url // ""')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "$wf: success - $url"
                break
              fi
              echo "::endgroup::"
              echo "::error::$wf concluded '$conclusion' for $SHA - $url"
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::endgroup::"
              echo "::error::Timed out after ${TIMEOUT_MINUTES}m waiting for $wf on $SHA (status: $status)"
              exit 1
            fi

            echo "$wf: $status - waiting..."
            sleep 20
          done
          echo "::endgroup::"
        done

        echo "Pipeline is green for $SHA"

  pypi-release:
    name: "Python Package Release"
    runs-on: ubuntu-latest
    needs: [check]
    timeout-minutes: 20

    permissions:
      contents: write  # upload release assets
      id-token: write  # PyPI Trusted Publishing (OIDC)

    strategy:
      fail-fast: false
      matrix:
        package:
          - dsw-command-queue
          - dsw-config
          - dsw-database
          - dsw-models
          - dsw-storage
          - dsw-tdk

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Create build info
      run: |
        bash scripts/build-info.sh

    - name: Build distribution packages
      run: |
        uv build --no-create-gitignore --package ${{ matrix.package }}
        ls -lah dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages_dir: ./dist
        print_hash: true
        verbose: true
        skip_existing: true

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" ./dist/* --clobber

  # Reuses the Translations workflow rather than duplicating its steps.
  mail-translations:
    name: "Mail Template Translations"
    needs: [check]
    uses: ./.github/workflows/translations.yml

  mail-translations-assets:
    name: "Mail Template Translations (assets)"
    runs-on: ubuntu-latest
    needs: [mail-translations]
    timeout-minutes: 15

    permissions:
      contents: write  # upload release assets

    steps:
    - name: Download POT files
      uses: actions/download-artifact@v8
      with:
        name: mail-pot-files
        path: pot

    - name: Upload release assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}  # no checkout in this job
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          pot/*.pot --clobber
